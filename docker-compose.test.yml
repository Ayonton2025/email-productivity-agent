name: email-productivity-agent-test

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVICE_NAME: email-productivity-agent-test
      ENVIRONMENT: test
      ENABLE_MOCK_MODE: "true"
      SKIP_DB_INIT: "false"
      DATABASE_URL: sqlite+aiosqlite:////tmp/email-agent-test.db
      CELERY_ENABLED: "false"
      ENABLE_LIVE_FX_RATES: "false"
      ENABLE_GEOIP_DETECTION: "false"
      SECRET_KEY: test-only-secret-key-at-least-32-characters
      ENCRYPTION_KEY: test-only-encryption-key-32-chars!!
      TRUSTED_HOSTS: localhost,127.0.0.1,backend
      ALLOWED_ORIGINS: http://localhost:${TEST_FRONTEND_PORT:-3000}
    ports:
      - "${TEST_BACKEND_PORT:-8000}:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12

  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /workspace/backend
    volumes:
      - .:/workspace:ro
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      COVERAGE_FILE: /tmp/email-agent-coverage
      ENVIRONMENT: test
      ENABLE_MOCK_MODE: "true"
      SKIP_DB_INIT: "false"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      CELERY_ENABLED: "false"
      ENABLE_LIVE_FX_RATES: "false"
      ENABLE_GEOIP_DETECTION: "false"
      SECRET_KEY: test-only-secret-key-at-least-32-characters
      ENCRYPTION_KEY: test-only-encryption-key-32-chars!!
    entrypoint: []
    command: ["python", "-m", "pytest", "-p", "no:cacheprovider", "tests", "--cov=app", "--cov-report=term-missing"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:${TEST_BACKEND_PORT:-8000}/api/v1
      VITE_PROXY_TARGET: http://backend:8000
      VITE_WS_PROXY_TARGET: ws://backend:8000
      VITE_BACKEND_URL: http://localhost:${TEST_BACKEND_PORT:-8000}
      VITE_WS_URL: ws://localhost:${TEST_BACKEND_PORT:-8000}
      VITE_APP_NAME: Bylix Email (Mock)
    ports:
      - "${TEST_FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 12
    depends_on:
      backend:
        condition: service_healthy

  frontend-tests:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    entrypoint: []
    command: ["npm", "run", "test:coverage"]
