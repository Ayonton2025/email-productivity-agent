name: email-productivity-agent-test

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVICE_NAME: email-productivity-agent-test
      ENVIRONMENT: test
      ENABLE_MOCK_MODE: "true"
      SKIP_DB_INIT: "false"
      DATABASE_URL: sqlite+aiosqlite:////tmp/email-agent-test.db
      CELERY_ENABLED: "false"
      ENABLE_LIVE_FX_RATES: "false"
      ENABLE_GEOIP_DETECTION: "false"
      SECRET_KEY: test-only-secret-key-at-least-32-characters
      ENCRYPTION_KEY: test-only-encryption-key-32-chars!!
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12

  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: test
      ENABLE_MOCK_MODE: "true"
      SKIP_DB_INIT: "false"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      CELERY_ENABLED: "false"
      ENABLE_LIVE_FX_RATES: "false"
      ENABLE_GEOIP_DETECTION: "false"
      SECRET_KEY: test-only-secret-key-at-least-32-characters
      ENCRYPTION_KEY: test-only-encryption-key-32-chars!!
    entrypoint: []
    command: ["python", "-m", "pytest", "tests", "--cov=app", "--cov-report=term-missing"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_BACKEND_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
      VITE_APP_NAME: Bylix Email (Mock)
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  frontend-tests:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    entrypoint: []
    command: ["npm", "run", "test:coverage"]
