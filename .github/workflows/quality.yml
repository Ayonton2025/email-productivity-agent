name: Quality

on:
  push:
  pull_request:

jobs:
  fresh-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify clean checkout
        run: bash scripts/verify-fresh-clone.sh

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest tests --cov=app --cov-report=term-missing --cov-fail-under=31 -q
      - name: Enforce maintained domain coverage
        run: >-
          python -m pytest tests
          --cov=app.core
          --cov=app.models
          --cov=app.utils
          --cov=app.services.email_service
          --cov=app.services.llm_orchestration_service
          --cov=app.services.model_registry
          --cov=app.services.prompt_registry
          --cov-report=term-missing
          --cov-fail-under=50
          -q
      - name: Enforce critical validation coverage
        run: >-
          python -m pytest
          tests/test_api_schema_contract.py
          tests/test_input_validation.py
          tests/test_security_middleware.py
          --cov=app.api.schemas
          --cov=app.core.input_validation
          --cov-report=term-missing
          --cov-fail-under=90
          -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend security tooling
        working-directory: backend
        run: python -m pip install -r requirements-lock.txt
      - name: Static Python security analysis
        working-directory: backend
        run: python -m bandit -c pyproject.toml -r app --severity-level medium
      - name: Audit Python dependencies
        working-directory: backend
        run: python -m pip_audit
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  deployment-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build isolated deployment images
        run: docker compose -f docker-compose.test.yml build
