name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fresh-clone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify Linux clean checkout
        if: runner.os == 'Linux'
        run: bash scripts/verify-fresh-clone.sh
      - name: Verify Windows clean checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-fresh-clone.ps1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deployment-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify isolated deployment
        run: bash scripts/verify-compose.sh
