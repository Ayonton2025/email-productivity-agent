name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release (for example, 2.1.0 or v2.1.0-rc.1)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  tag:
    name: Create version tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and create annotated tag
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          version="${REQUESTED_VERSION}"
          [[ "${version}" == v* ]] || version="v${version}"
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: ${version}" >&2
            exit 1
          fi
          if git rev-parse "${version}" >/dev/null 2>&1; then
            echo "Tag ${version} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${version}" --message "Release ${version}"
          git push origin "${version}"

  release:
    name: Build and publish images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          version="${REQUESTED_VERSION}"
          [[ "${version}" == v* ]] || version="v${version}"
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [[ "${version}" == *-* ]]; then
            echo "stable=false" >> "${GITHUB_OUTPUT}"
          else
            echo "stable=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Normalize container namespace
        id: registry
        run: echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image metadata
        id: backend_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.registry.outputs.namespace }}/email-productivity-agent-backend
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.version.outputs.stable }}
          labels: |
            org.opencontainers.image.title=Email Productivity Agent Backend
            org.opencontainers.image.description=FastAPI API and worker runtime

      - name: Frontend image metadata
        id: frontend_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.registry.outputs.namespace }}/email-productivity-agent-frontend
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.version.outputs.stable }}
          labels: |
            org.opencontainers.image.title=Email Productivity Agent Frontend
            org.opencontainers.image.description=React and Vite web client

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          sbom: true
          provenance: mode=max

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend_meta.outputs.tags }}
          labels: ${{ steps.frontend_meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          sbom: true
          provenance: mode=max

      - name: Publish release summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "## ${VERSION}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Published immutable version and commit-SHA tags for both application images." >> "${GITHUB_STEP_SUMMARY}"
          namespace="${GITHUB_REPOSITORY_OWNER,,}"
          echo "- \`ghcr.io/${namespace}/email-productivity-agent-backend:${VERSION}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- \`ghcr.io/${namespace}/email-productivity-agent-frontend:${VERSION}\`" >> "${GITHUB_STEP_SUMMARY}"
