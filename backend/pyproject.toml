[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email-productivity-agent-backend"
version = "1.0.0"
description = "FastAPI backend for the Bylix email productivity agent"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.24.0",
  "sqlalchemy==2.0.23",
  "alembic==1.12.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "python-dotenv==1.2.2",
  "aiosqlite==0.19.0",
  "asyncpg==0.29.0",
  "httpx==0.25.2",
  "redis==5.0.1",
  "celery==5.3.4",
  "python-multipart==0.0.32",
  "email-validator==2.1.0.post1",
  "PyJWT==2.13.0",
  "passlib[bcrypt,argon2]==1.7.4",
  "bcrypt==4.0.1",
  "cryptography==50.0.0",
  "requests==2.33.0",
  "google-generativeai==0.8.6",
  "openai==1.3.0",
  "anthropic==0.7.4",
  "google-auth-oauthlib==1.1.0",
  "google-auth-httplib2==0.2.0",
  "google-api-python-client==2.108.0",
  "msal==1.38.0",
  "imapclient==2.3.1",
  "aiosmtplib==5.1.2",
  "stripe==13.1.2",
  "pypdf==6.15.0",
  "python-docx==1.1.2",
  "openpyxl==3.1.5",
  "python-pptx==0.6.23",
  "python-dateutil==2.9.0.post0",
  "pytz==2023.3",
  "pydantic-extra-types==2.3.0",
  "sentry-sdk==2.35.1",
  "slowapi==0.1.9",
  "structlog==25.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "pytest-cov==4.1.0",
  "ruff==0.8.6",
  "mypy==1.13.0",
  "bandit==1.8.6",
  "pip-audit==2.9.0",
]

[tool.bandit]
exclude_dirs = ["tests", "alembic", ".venv", ".venv-fresh"]
skips = ["B101", "B104"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --disable-warnings"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 30

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["alembic", ".venv", ".venv-fresh"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "I", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
"app/services/billing_service.py" = ["C901"]
"app/services/billing/upgrades.py" = ["C901"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
files = ["app/core", "app/api/schemas.py"]
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "(^alembic/|^tests/)"
